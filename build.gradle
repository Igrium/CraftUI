plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.16'
    id 'maven-publish'
    id "io.freefair.lombok" version "8.13.1"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Lombok 1.18.46+ is required to support the Java 25 javac internals used by MC 26.2.
lombok {
    version = "1.18.46"
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url "https://maven.nucleoid.xyz/"
        name "Nucleoid"
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    runs {
        testmodClient {
            client()
            name = "Testmod Client"
            source sourceSets.testmod
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft is unobfuscated from 26.1 onwards — no mappings needed.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Dear ImGui — provides the ImGui context, GLFW input, and render backend.
    // Pulls in imgui-java (binding + natives) transitively.
    api "cn.enaium:fabric-gui-imgui:${project.imgui_version}";

    api include("org.lwjgl:lwjgl-nfd:3.3.3")
    runtimeOnly include("org.lwjgl:lwjgl-nfd:3.3.3:natives-windows")
    runtimeOnly include("org.lwjgl:lwjgl-nfd:3.3.3:natives-macos")
    runtimeOnly include("org.lwjgl:lwjgl-nfd:3.3.3:natives-macos-arm64")
    runtimeOnly include("org.lwjgl:lwjgl-nfd:3.3.3:natives-linux")

    testmodImplementation sourceSets.main.output

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
